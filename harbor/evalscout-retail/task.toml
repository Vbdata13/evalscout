schema_version = "1.3"
artifacts = [
    "/workspace/submission/findings.json",
    "/workspace/submission/evaluator.py",
    "/workspace/submission/recommendations.md",
]

[metadata]
category = "evaluation-research"
tags = ["retail", "agent-evaluation", "failure-discovery", "python"]

[agent]
timeout_sec = 1800
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 12288
workdir = "/workspace"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 120

[verifier.environment]
cpus = 1
memory_mb = 512
storage_mb = 2048
